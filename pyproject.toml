[project]
name = "api"
version = "0.1.0"
description = "Api backend for searchit"
authors = [
    { name = "NasriAnis", email = "nasrianis213@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "uvicorn>=0.53.0",
]

[project.scripts]
api = "api:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
